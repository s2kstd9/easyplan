<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - 학습계획이</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* Navigation Menu Styles */
        .nav-menu {
            background-color: #2c3e50;
            color: white;
            padding: 0;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
        }

        .nav-menu h2 {
            margin: 0;
            padding: 15px 20px;
            font-size: 1.2em;
            white-space: nowrap;
        }

        .nav-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .nav-menu li {
            position: relative;
            padding: 0;
        }

        .nav-menu a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .nav-menu a:hover {
            background-color: #34495e;
        }

        /* Main Content Styles */
        .main-content {
            padding: 80px 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            padding: 40px;
        }

        .error-code {
            font-size: 72px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 24px;
            color: #34495e;
            margin-bottom: 30px;
        }

        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <!-- Navigation Menu -->
    <nav class="nav-menu">
        <h2>학습 계획 시스템</h2>
        <ul>
            <li><a href="/home" class="nav-link">홈으로</a></li>
            <li><a href="/subjects" class="nav-link">과목 편집</a></li>
            <li><a href="/timetable" class="nav-link">기준시간표</a></li>
            <li><a href="/study-plan" class="nav-link">학습계획</a></li>
            <li><a href="/about" class="nav-link">About</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="error-container">
            <div class="error-code">404</div>
            <div class="error-message">페이지를 찾을 수 없습니다</div>
            <a href="/home" class="back-button">홈으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
