    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    <script>
        const canvas = document.getElementById('timeline');
        const ctx = canvas.getContext('2d');
        const timelineContainer = document.getElementById('timelineContainer');
        const scheduleContainer = document.getElementById('scheduleContainer');
        const scheduleItems = document.querySelectorAll('.schedule-item');

        // 캔버스 크기 설정
        canvas.width = 800;
        canvas.height = 1500; // (24시간 * 60픽셀) + 상단 여백 30px + 하단 여백 30px

        // 타임라인 설정
        const startHour = 0;   // 시작 시간 (0시)
        const endHour = 24;    // 종료 시간 (24시)
        const hourHeight = 60; // 1시간당 픽셀 높이
        const minuteHeight = hourHeight / 60; // 1분당 픽셀 높이
        const columnWidth = 100; // 각 요일 컬럼의 너비
        const timelineX = 50;  // 시간 표시 X 좌표
        const topMargin = 50;  // 상단 여백 (요일 표시를 위해 증가)
        const days = ['월', '화', '수', '목', '금', '토', '일'];

        function drawTimelineBase() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 배경을 흰색으로 설정
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 시간 표시 및 가로선
            ctx.font = '12px Arial';
            ctx.fillStyle = '#333333';
            for (let hour = startHour; hour <= endHour; hour++) {
                const y = hour * hourHeight + topMargin;
                const rightX = timelineX + columnWidth * days.length + 10;
                
                // 좌측 시간 텍스트
                ctx.textAlign = 'right';
                if (hour === 24) {
                    ctx.fillText('24:00', timelineX - 10, y + 4);
                } else {
                    ctx.fillText(`${hour.toString().padStart(2, '0')}:00`, timelineX - 10, y + 4);
                }

                // 우측 시간 텍스트
                ctx.textAlign = 'left';
                if (hour === 24) {
                    ctx.fillText('24:00', rightX, y + 4);
                } else {
                    ctx.fillText(`${hour.toString().padStart(2, '0')}:00`, rightX, y + 4);
                }
                
                // 정시 가로선 (진한 선)
                ctx.beginPath();
                ctx.moveTo(timelineX, y);
                ctx.lineTo(rightX - 10, y);
                ctx.strokeStyle = hour === 24 ? '#000' : '#ccc';
                ctx.stroke();

                // 10분 단위 가로선 (연한 선)
                if (hour < endHour) {
                    ctx.strokeStyle = '#eee';
                    for (let minute = 10; minute < 60; minute += 10) {
                        const minuteY = y + (minute * minuteHeight);
                        ctx.beginPath();
                        ctx.moveTo(timelineX, minuteY);
                        ctx.lineTo(rightX - 10, minuteY);
                        ctx.stroke();
                    }
                }
            }

            // 세로선 (요일 구분선)
            ctx.strokeStyle = '#000';
            for (let i = 0; i <= days.length; i++) {
                const x = timelineX + columnWidth * i;
                ctx.beginPath();
                ctx.moveTo(x, topMargin);
                ctx.lineTo(x, endHour * hourHeight + topMargin);
                ctx.stroke();
            }
        }

        function formatTime(hour, minute) {
            return `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
        }

        // 컨텍스트 메뉴 관련 변수
        let activeContextMenu = null;

        // 컨텍스트 메뉴 생성 함수
        function createContextMenu(x, y) {
            // 이전 컨텍스트 메뉴 제거
            removeContextMenu();

            const menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;

            const deleteItem = document.createElement('div');
            deleteItem.className = 'context-menu-item delete';
            deleteItem.textContent = '삭제';
            menu.appendChild(deleteItem);

            document.body.appendChild(menu);
            activeContextMenu = menu;

            return menu;
        }

        // 컨텍스트 메뉴 제거 함수
        function removeContextMenu() {
            if (activeContextMenu) {
                activeContextMenu.remove();
                activeContextMenu = null;
            }
        }

        function addContextMenu(block) {
            block.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                removeContextMenu(); // 기존 메뉴 제거
                
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                menu.style.left = `${e.clientX}px`;
                menu.style.top = `${e.clientY}px`;

                const deleteItem = document.createElement('div');
                deleteItem.className = 'context-menu-item delete';
                deleteItem.textContent = '삭제';
                menu.appendChild(deleteItem);

                document.body.appendChild(menu);
                activeContextMenu = menu;

                deleteItem.addEventListener('click', () => {
                    block.remove();
                    removeContextMenu();
                });
            });
        }

        function createScheduleBlock(x, y) {
            const block = document.createElement('div');
            block.className = 'schedule-block';
            block.style.top = `${y}px`;
            block.style.left = `${x}px`;
            block.style.height = `${hourHeight}px`;
            block.style.width = `${columnWidth - 20}px`; // 컬럼 너비에서 여백 제외

            // 드래그된 항목 정보 가져오기
            const draggedItem = document.querySelector('.schedule-item[draggable="true"]:active');
            const subject = draggedItem ? draggedItem.getAttribute('data-subject') : '국어';
            const itemName = draggedItem ? draggedItem.getAttribute('data-item-name') : '';
            block.setAttribute('data-subject', subject);

            // 내용을 담을 div 추가
            const content = document.createElement('div');
            content.className = 'schedule-content';
            
            // 학습항목명을 표시할 div 추가
            const subjectDiv = document.createElement('div');
            subjectDiv.className = 'subject';
            subjectDiv.textContent = itemName;
            content.appendChild(subjectDiv);

            // 시간 정보를 표시할 div 추가
            const timeDiv = document.createElement('div');
            content.appendChild(timeDiv);

            block.appendChild(content);
            block.draggable = false;

            // 리사이즈 핸들 추가
            const topHandle = document.createElement('div');
            topHandle.className = 'resize-handle top';
            const bottomHandle = document.createElement('div');
            bottomHandle.className = 'resize-handle bottom';

            block.appendChild(topHandle);
            block.appendChild(bottomHandle);

            // 시간 표시 업데이트
            updateScheduleTime(block);
            
            // 컨텍스트 메뉴 추가
            addContextMenu(block);

            return block;
        }

        function updateScheduleTime(block) {
            const top = parseInt(block.style.top) - topMargin;
            const height = parseInt(block.style.height);
            
            const startMinutes = Math.round(top / minuteHeight);
            const startHour = Math.floor(startMinutes / 60);
            const startMinute = startMinutes % 60;
            
            const endMinutes = Math.round((top + height) / minuteHeight);
            const endHour = Math.floor(endMinutes / 60);
            const endMinute = endMinutes % 60;
            
            const duration = Math.round(height / minuteHeight);
            
            // 블록 내용 업데이트
            const content = block.querySelector('.schedule-content');
            content.innerHTML = ''; // 기존 내용 초기화

            // 학습항목명 추가
            const itemName = block.getAttribute('data-item-name');
            const subjectDiv = document.createElement('div');
            subjectDiv.className = 'subject';
            subjectDiv.textContent = itemName;
            content.appendChild(subjectDiv);

            // 시간 정보 추가
            const timeDiv = document.createElement('div');
            timeDiv.className = 'time';
            timeDiv.textContent = `${formatTime(startHour, startMinute)} - ${formatTime(endHour, endMinute)}`;
            content.appendChild(timeDiv);

            // 시간 계산 추가
            const durationDiv = document.createElement('div');
            durationDiv.className = 'duration';
            durationDiv.textContent = `(${duration}분)`;
            content.appendChild(durationDiv);

            // 과목명 추가
            const subjectName = block.getAttribute('data-subject');
            const subjectNameDiv = document.createElement('div');
            subjectNameDiv.className = 'subject-name';
            subjectNameDiv.textContent = subjectName;
            content.appendChild(subjectNameDiv);
        }

        // 일정 블록 간 충돌 검사 함수
        function checkCollision(block, newTop, newHeight, newLeft) {
            const blocks = Array.from(scheduleContainer.querySelectorAll('.schedule-block'));
            const otherBlocks = blocks.filter(b => b !== block && b.id !== 'dragPreviewGhost');

            // 새로운 영역의 상단과 하단 좌표
            const newBottom = newTop + newHeight;

            // 다른 모든 블록과 충돌 검사
            return otherBlocks.some(otherBlock => {
                const otherTop = parseInt(otherBlock.style.top);
                const otherBottom = otherTop + parseInt(otherBlock.style.height);
                const otherLeft = parseInt(otherBlock.style.left);

                // 같은 요일 컬럼에 있는 블록끼리만 충돌 체크
                return (newLeft === otherLeft && newTop < otherBottom && newBottom > otherTop);
            });
        }

        function makeResizable(block) {
            let isResizing = false;
            let startY;
            let startHeight;
            let startTop;
            let currentHandle;

            function handleMouseDown(e) {
                if (!e.target.classList.contains('resize-handle')) return;
                
                isResizing = true;
                currentHandle = e.target;
                startY = e.clientY;
                startHeight = parseInt(block.style.height);
                startTop = parseInt(block.style.top);
                
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
                e.stopPropagation();
            }

            function handleMouseMove(e) {
                if (!isResizing) return;

                const dy = e.clientY - startY;
                const minHeight = minuteHeight * 10; // 최소 10분

                if (currentHandle.classList.contains('top')) {
                    const newHeight = startHeight - dy;
                    const newTop = startTop + dy;
                    
                    // 10분 단위로 스냅
                    const snapDy = Math.round(dy / (minuteHeight * 10)) * (minuteHeight * 10);
                    const snapNewHeight = startHeight - snapDy;
                    const snapNewTop = startTop + snapDy;

                    // 다른 일정과의 충돌 검사
                    const blocks = Array.from(scheduleContainer.querySelectorAll('.schedule-block'));
                    const currentLeft = parseInt(block.style.left);
                    const otherBlocks = blocks.filter(b => {
                        return b !== block && 
                               parseInt(b.style.left) === currentLeft && 
                               parseInt(b.style.top) < startTop;
                    });

                    // 위쪽 블록들 중 가장 아래에 있는 블록 찾기
                    let maxBottomOfUpperBlocks = 0;
                    otherBlocks.forEach(b => {
                        const bottom = parseInt(b.style.top) + parseInt(b.style.height);
                        if (bottom > maxBottomOfUpperBlocks) {
                            maxBottomOfUpperBlocks = bottom;
                        }
                    });
                    
                    // 최소 높이, 상단 여백, 충돌 체크
                    if (snapNewHeight >= minHeight && 
                        snapNewTop >= topMargin &&
                        snapNewTop >= maxBottomOfUpperBlocks) {
                        block.style.height = `${snapNewHeight}px`;
                        block.style.top = `${snapNewTop}px`;
                        requestAnimationFrame(() => updateScheduleTime(block));
                    }
                } else {
                    const newHeight = startHeight + dy;
                    
                    // 10분 단위로 스냅
                    const snapNewHeight = Math.round(newHeight / (minuteHeight * 10)) * (minuteHeight * 10);

                    // 다른 일정과의 충돌 검사
                    const blocks = Array.from(scheduleContainer.querySelectorAll('.schedule-block'));
                    const currentLeft = parseInt(block.style.left);
                    const otherBlocks = blocks.filter(b => {
                        return b !== block && 
                               parseInt(b.style.left) === currentLeft && 
                               parseInt(b.style.top) > startTop;
                    });

                    // 아래쪽 블록들 중 가장 위에 있는 블록 찾기
                    let minTopOfLowerBlocks = canvas.height;
                    otherBlocks.forEach(b => {
                        const top = parseInt(b.style.top);
                        if (top < minTopOfLowerBlocks && top >= startTop) {
                            minTopOfLowerBlocks = top;
                        }
                    });
                    
                    // 최소 높이, 캔버스 범위, 충돌 체크
                    if (snapNewHeight >= minHeight && 
                        (startTop + snapNewHeight) <= canvas.height &&
                        (startTop + snapNewHeight) <= minTopOfLowerBlocks) {
                        block.style.height = `${snapNewHeight}px`;
                        requestAnimationFrame(() => updateScheduleTime(block));
                    }
                }
            }

            function handleMouseUp() {
                isResizing = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            }

            block.addEventListener('mousedown', handleMouseDown);
        }

        function makeDraggable(block) {
            let isDragging = false;
            let startY;
            let startX;
            let startTop;
            let startLeft;
            let isCtrlPressed = false;
            let clonedBlock = null;
            let offsetX, offsetY;
            let longPressTimer = null;
            let isLongPress = false;

            function handleMouseDown(e) {
                if (e.target.classList.contains('resize-handle')) return;
                
                isDragging = false;
                startY = e.clientY;
                startX = e.clientX;
                startTop = parseInt(block.style.top);
                startLeft = parseInt(block.style.left);
                isCtrlPressed = e.ctrlKey;

                // 롱클릭 타이머 시작
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    // 롱클릭 시 복사 모드로 전환
                    clonedBlock = block.cloneNode(true);
                    clonedBlock.style.opacity = '0.5';
                    clonedBlock.style.position = 'absolute';
                    clonedBlock.style.left = block.style.left;
                    clonedBlock.style.top = block.style.top;
                    
                    makeResizable(clonedBlock);
                    makeDraggable(clonedBlock);
                    addContextMenu(clonedBlock);
                    
                    scheduleContainer.appendChild(clonedBlock);
                    isDragging = true;
                }, 500);

                // 마우스와 블록의 상대적 위치 차이 저장
                const rect = block.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                // Ctrl 키가 눌린 경우 블록 복사
                if (isCtrlPressed) {
                    clonedBlock = block.cloneNode(true);
                    clonedBlock.style.opacity = '0.5';
                    clonedBlock.style.position = 'absolute';
                    clonedBlock.style.left = block.style.left;
                    clonedBlock.style.top = block.style.top;
                    
                    makeResizable(clonedBlock);
                    makeDraggable(clonedBlock);
                    addContextMenu(clonedBlock);
                    
                    scheduleContainer.appendChild(clonedBlock);
                }
                
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
                e.preventDefault();
            }

            function handleMouseMove(e) {
                if (!isDragging && !isLongPress) {
                    // 마우스가 일정 거리 이상 움직였을 때만 드래그 시작
                    const moveX = Math.abs(e.clientX - startX);
                    const moveY = Math.abs(e.clientY - startY);
                    if (moveX > 5 || moveY > 5) {
                        isDragging = true;
                        clearTimeout(longPressTimer);
                    }
                }

                if (isDragging || isLongPress) {
                    const targetBlock = isCtrlPressed || isLongPress ? clonedBlock : block;
                    if (targetBlock) {
                        const timelineRect = timelineContainer.getBoundingClientRect();
                        
                        if (e.clientX >= timelineRect.left && e.clientX <= timelineRect.right &&
                            e.clientY >= timelineRect.top && e.clientY <= timelineRect.bottom) {
                            
                            const mouseX = e.clientX - timelineRect.left + timelineContainer.scrollLeft;
                            const mouseY = e.clientY - timelineRect.top + timelineContainer.scrollTop;
                            
                            const column = Math.floor((mouseX - offsetX - timelineX + columnWidth/2) / columnWidth);
                            const snapLeft = timelineX + (column * columnWidth) + 10;
                            const snapTop = Math.round((mouseY - offsetY - topMargin) / (minuteHeight * 10)) * (minuteHeight * 10) + topMargin;
                            const targetHeight = parseInt(targetBlock.style.height);

                            if (column >= 0 && column < days.length && 
                                snapTop >= topMargin && 
                                snapTop + targetHeight <= endHour * hourHeight + topMargin) {
                                
                                targetBlock.style.left = `${snapLeft}px`;
                                targetBlock.style.top = `${snapTop}px`;

                                // 실시간 충돌 검사
                                const isConflict = checkCollision(targetBlock, snapTop, targetHeight, snapLeft);
                                if (isConflict) {
                                    targetBlock.setAttribute('data-conflict', 'true');
                                    targetBlock.classList.add('conflict-invalid');
                                } else {
                                    targetBlock.removeAttribute('data-conflict');
                                    targetBlock.classList.remove('conflict-invalid');
                                    targetBlock.style.opacity = '0.85';
                                }

                                requestAnimationFrame(() => updateScheduleTime(targetBlock));
                            }
                        }
                    }
                }
            }

            function handleMouseUp(e) {
                clearTimeout(longPressTimer);
                const targetBlock = isCtrlPressed || isLongPress ? clonedBlock : block;
                
                if (targetBlock) {
                    const isConflict = targetBlock.getAttribute('data-conflict') === 'true';
                    const timelineRect = timelineContainer.getBoundingClientRect();
                    const insideTimeline = e.clientX >= timelineRect.left && e.clientX <= timelineRect.right &&
                                           e.clientY >= timelineRect.top && e.clientY <= timelineRect.bottom;

                    if (insideTimeline && !isConflict) {
                        targetBlock.style.opacity = '1';
                        targetBlock.removeAttribute('data-conflict');
                        targetBlock.classList.remove('conflict-invalid');
                    } else {
                        if (isCtrlPressed || isLongPress) {
                            targetBlock.remove();
                            if (isConflict) {
                                showNotificationModal('해당 시간대에 이미 다른 학습항목이 위치해 있어 복사할 수 없습니다.');
                            }
                        } else {
                            // 기존 블록 원위치로 복귀
                            block.style.left = `${startLeft}px`;
                            block.style.top = `${startTop}px`;
                            block.style.opacity = '1';
                            block.removeAttribute('data-conflict');
                            block.classList.remove('conflict-invalid');
                            updateScheduleTime(block);
                            if (isConflict) {
                                showNotificationModal('해당 시간대에 이미 다른 학습항목이 위치해 있습니다.');
                            }
                        }
                    }
                }

                isDragging = false;
                isLongPress = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            }

            block.addEventListener('mousedown', handleMouseDown);

            // 터치 이벤트 처리
            let touchStartX, touchStartY;

            block.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;

                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    clonedBlock = block.cloneNode(true);
                    clonedBlock.style.opacity = '0.5';
                    scheduleContainer.appendChild(clonedBlock);
                    makeResizable(clonedBlock);
                    makeDraggable(clonedBlock);
                    addContextMenu(clonedBlock);
                }, 500);
            });

            block.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const moveX = Math.abs(touch.clientX - touchStartX);
                const moveY = Math.abs(touch.clientY - touchStartY);

                if (moveX > 5 || moveY > 5) {
                    clearTimeout(longPressTimer);
                }
            });

            block.addEventListener('touchend', (e) => {
                clearTimeout(longPressTimer);
                if (isLongPress && clonedBlock) {
                    const touch = e.changedTouches[0];
                    const timelineRect = timelineContainer.getBoundingClientRect();
                    
                    if (touch.clientX >= timelineRect.left && touch.clientX <= timelineRect.right &&
                        touch.clientY >= timelineRect.top && touch.clientY <= timelineRect.bottom) {
                        clonedBlock.style.opacity = '1';
                    } else {
                        clonedBlock.remove();
                    }
                }
                isLongPress = false;
            });
        }

        // 드래그 앤 드롭 이벤트 처리
        scheduleItems.forEach(item => {
            item.addEventListener('dragstart', function(e) {
                e.dataTransfer.setData('text/plain', item.getAttribute('data-subject'));
                // 드래그 이미지의 오프셋을 상단 중앙으로 설정
                const rect = e.target.getBoundingClientRect();
                const offsetX = (rect.width / 2);
                const offsetY = 0;
                e.dataTransfer.setDragImage(e.target, offsetX, offsetY);
            });
        });

        function removeDragGhost() {
            const dragGhost = document.getElementById('dragPreviewGhost');
            if (dragGhost) dragGhost.remove();
        }

        function removeGlobalDragGhost() {
            const globalGhost = document.getElementById('globalDragGhost');
            if (globalGhost) globalGhost.remove();
        }

        function updateGlobalDragGhost(clientX, clientY) {
            let globalGhost = document.getElementById('globalDragGhost');
            if (!globalGhost) {
                globalGhost = document.createElement('div');
                globalGhost.id = 'globalDragGhost';
                globalGhost.className = 'schedule-block global-drag-ghost';
                document.body.appendChild(globalGhost);
            }

            const templateData = window.currentDraggingTemplate;
            if (!templateData) {
                globalGhost.style.display = 'none';
                return;
            }

            const subject = templateData.subject || '국어';
            const itemName = templateData.itemName || '';

            globalGhost.style.display = 'block';
            globalGhost.style.position = 'fixed';
            globalGhost.style.left = `${clientX - 60}px`;
            globalGhost.style.top = `${clientY - 25}px`;
            globalGhost.style.width = '120px';
            globalGhost.style.height = '50px';
            globalGhost.style.backgroundColor = getSubjectColor(subject);
            globalGhost.style.zIndex = '99999';
            globalGhost.style.pointerEvents = 'none';
            globalGhost.style.opacity = '0.85';
            globalGhost.style.boxShadow = '0 6px 16px rgba(0, 0, 0, 0.3)';

            globalGhost.innerHTML = `
                <div class="schedule-content" style="padding: 4px; pointer-events: none;">
                    <div class="subject" style="font-weight: bold; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${itemName}</div>
                    <div class="duration" style="font-size: 10px; opacity: 0.85;">(60분)</div>
                    <div class="subject-name" style="font-size: 10px;">${subject}</div>
                </div>
            `;
        }

        // 전체 문서(Document) 드래그over 처리 -> 빗금 금지 커서 방지 및 패널 위 드래그 블록 연출
        document.addEventListener('dragover', function(e) {
            if (window.currentDraggingTemplate) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';

                const timelineRect = timelineContainer.getBoundingClientRect();
                const insideTimeline = e.clientX >= timelineRect.left && e.clientX <= timelineRect.right &&
                                       e.clientY >= timelineRect.top && e.clientY <= timelineRect.bottom;

                if (!insideTimeline) {
                    removeDragGhost();
                    updateGlobalDragGhost(e.clientX, e.clientY);
                } else {
                    removeGlobalDragGhost();
                }
            }
        });

        const subjectColorMap = {
            '국어': '#FF6B6B',
            '수학': '#4ECDC4',
            '영어': '#45B7D1',
            '사회': '#FFB347',
            '과학': '#96CEB4',
            '정보': '#9B59B6',
            '기가': '#F39C12',
            '가정': '#FF7F50',
            '음악': '#D35400',
            '미술': '#8E44AD',
            '체육': '#2ECC71',
            '실과': '#E67E22'
        };

        const defaultPalette = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFB347', '#96CEB4',
            '#9B59B6', '#F39C12', '#FF7F50', '#D35400', '#8E44AD',
            '#2ECC71', '#E67E22', '#3498DB', '#1ABC9C', '#E74C3C'
        ];

        function getSubjectColor(subjectName) {
            if (!subjectName) return '#45B7D1';
            if (subjectColorMap[subjectName]) {
                return subjectColorMap[subjectName];
            }
            let hash = 0;
            for (let i = 0; i < subjectName.length; i++) {
                hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % defaultPalette.length;
            return defaultPalette[index];
        }

        timelineContainer.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            removeGlobalDragGhost();

            const rect = timelineContainer.getBoundingClientRect();
            const x = e.clientX - rect.left + timelineContainer.scrollLeft;
            const y = e.clientY - rect.top + timelineContainer.scrollTop;
            
            const column = Math.floor((x - timelineX) / columnWidth);
            const snapLeft = timelineX + (column * columnWidth) + 10;
            const snapTop = Math.round((y - topMargin) / (minuteHeight * 10)) * (minuteHeight * 10) + topMargin;

            let dragGhost = document.getElementById('dragPreviewGhost');
            if (!dragGhost) {
                dragGhost = document.createElement('div');
                dragGhost.id = 'dragPreviewGhost';
                dragGhost.className = 'schedule-block drag-preview-ghost';
                scheduleContainer.appendChild(dragGhost);
            }

            if (column >= 0 && column < days.length && snapTop >= topMargin && snapTop + hourHeight <= endHour * hourHeight + topMargin) {
                dragGhost.style.display = 'block';
                dragGhost.style.left = `${snapLeft}px`;
                dragGhost.style.top = `${snapTop}px`;
                dragGhost.style.width = `${columnWidth - 20}px`;
                dragGhost.style.height = `${hourHeight}px`;

                const templateData = window.currentDraggingTemplate || {};
                const subject = templateData.subject || '국어';
                const itemName = templateData.itemName || '';
                dragGhost.setAttribute('data-subject', subject);
                dragGhost.setAttribute('data-item-name', itemName);
                dragGhost.style.backgroundColor = getSubjectColor(subject);

                const startMinutes = Math.round((snapTop - topMargin) / minuteHeight);
                const sHour = Math.floor(startMinutes / 60);
                const sMin = startMinutes % 60;
                const endMinutes = startMinutes + 60;
                const eHour = Math.floor(endMinutes / 60);
                const eMin = endMinutes % 60;

                dragGhost.innerHTML = `
                    <div class="schedule-content">
                        <div class="subject">${itemName}</div>
                        <div class="time">${formatTime(sHour, sMin)} - ${formatTime(eHour, eMin)}</div>
                        <div class="duration">(60분)</div>
                        <div class="subject-name">${subject}</div>
                    </div>
                `;

                const isConflict = checkCollision(null, snapTop, hourHeight, snapLeft);

                if (isConflict) {
                    dragGhost.classList.add('conflict-invalid');
                    dragGhost.setAttribute('data-conflict', 'true');
                    dragGhost.style.opacity = '0.9';
                } else {
                    dragGhost.classList.remove('conflict-invalid');
                    dragGhost.removeAttribute('data-conflict');
                    dragGhost.style.opacity = '0.7';
                }
            } else {
                dragGhost.style.display = 'none';
            }
        });

        timelineContainer.addEventListener('dragleave', function(e) {
            const rect = timelineContainer.getBoundingClientRect();
            if (e.clientX <= rect.left || e.clientX >= rect.right || e.clientY <= rect.top || e.clientY >= rect.bottom) {
                removeDragGhost();
                if (window.currentDraggingTemplate) {
                    updateGlobalDragGhost(e.clientX, e.clientY);
                }
            }
        });

        timelineContainer.addEventListener('drop', function(e) {
            e.preventDefault();
            removeDragGhost();
            removeGlobalDragGhost();

            const rect = timelineContainer.getBoundingClientRect();
            const x = e.clientX - rect.left + timelineContainer.scrollLeft;
            const y = e.clientY - rect.top + timelineContainer.scrollTop;
            
            const snapTop = Math.round((y - topMargin) / (minuteHeight * 10)) * (minuteHeight * 10) + topMargin;
            const column = Math.floor((x - timelineX) / columnWidth);
            const snapLeft = timelineX + (column * columnWidth) + 10;

            const isConflict = checkCollision(null, snapTop, hourHeight, snapLeft);

            if (snapTop >= topMargin && 
                snapTop + hourHeight <= endHour * hourHeight + topMargin && 
                column >= 0 && 
                column < days.length &&
                !isConflict) {
                
                let dragData = null;
                try {
                    dragData = JSON.parse(e.dataTransfer.getData('text/plain'));
                } catch (err) {
                    return;
                }

                if (dragData) {
                    const block = createScheduleBlock(snapLeft, snapTop);
                    block.setAttribute('data-item-id', dragData.id);
                    block.setAttribute('data-subject', dragData.subject);
                    block.setAttribute('data-item-name', dragData.itemName);
                    block.style.backgroundColor = getSubjectColor(dragData.subject);
                    scheduleContainer.appendChild(block);
                    makeResizable(block);
                    makeDraggable(block);
                    updateScheduleTime(block);
                }
            } else if (isConflict) {
                showNotificationModal('해당 시간대에 이미 다른 학습항목이 위치해 있어 추가할 수 없습니다.');
            }
        });

        // 초기 타임라인 그리기
        drawTimelineBase();

        // 윈도우 리사이즈 시 타임라인 다시 그리기
        window.addEventListener('resize', drawTimelineBase);

        // 다른 곳 클릭시 컨텍스트 메뉴 닫기
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.context-menu')) {
                removeContextMenu();
            }
        });

        // ESC 키로 컨텍스트 메뉴 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                removeContextMenu();
            }
        });

        // 스크롤 시 컨텍스트 메뉴 닫기
        timelineContainer.addEventListener('scroll', removeContextMenu);

        // 초기 스크롤 위치 설정 (05:00)
        window.addEventListener('load', function() {
            const scrollTo5am = 5 * hourHeight;
            timelineContainer.scrollTop = scrollTo5am;
        });

        // 전역 변수 추가
        let subjects = [];
        let items = [];

        // 페이지 로드 시 초기 데이터 로드
        window.addEventListener('DOMContentLoaded', async () => {
            await loadSubjects();
            await loadItems();
        });

        // 과목 데이터 로드
        async function loadSubjects() {
            try {
                const response = await fetch('/api/subjects');
                subjects = await response.json();
                populateSubjectSelect();
            } catch (error) {
                console.error('과목 로드 실패:', error);
            }
        }

        // 학습항목 데이터 로드
        async function loadItems() {
            try {
                const response = await fetch('/api/items');
                items = await response.json();
                console.log('Loaded items:', items); // 디버깅 로그 추가
                displayItems();
            } catch (error) {
                console.error('학습항목 로드 실패:', error);
            }
        }

        // 과목 선택 옵션 채우기
        function populateSubjectSelect() {
            const select = document.getElementById('subjectSelect');
            select.innerHTML = '';
            if (!subjects || subjects.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '-- 선택 가능한 과목 없음 (과목 등록 필요) --';
                select.appendChild(option);
                return;
            }
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.subjectName;
                select.appendChild(option);
            });
        }

        // 학습항목 표시
        function displayItems() {
            const itemList = document.getElementById('itemList');
            itemList.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'schedule-item';
                div.setAttribute('data-id', item.id);
                div.setAttribute('data-subject', item.subjectName);
                div.setAttribute('data-item-name', item.itemName);
                div.setAttribute('draggable', 'true');

                // 더블클릭 이벤트 추가
                div.addEventListener('dblclick', () => {
                    openModal(item);
                });

                // 롱클릭 관련 변수
                let pressTimer = null;
                let isLongPress = false;
                let isDragging = false;

                // 롱클릭 이벤트 처리
                function startPress(e) {
                    if (isDragging) return;
                    pressTimer = setTimeout(() => {
                        if (!isDragging) {  // 드래그 중이 아닐 때만 모달 열기
                            isLongPress = true;
                            openModal(item);
                        }
                    }, 500);
                }

                function endPress() {
                    clearTimeout(pressTimer);
                    isLongPress = false;
                }

                // 드래그 시작 시 롱클릭 타이머 취소 및 데이터 설정
                div.addEventListener('dragstart', (e) => {
                    isDragging = true;
                    clearTimeout(pressTimer);
                    const dragData = {
                        id: item.id,
                        subject: item.subjectName,
                        itemName: item.itemName
                    };
                    window.currentDraggingTemplate = dragData;
                    e.dataTransfer.setData('text/plain', JSON.stringify(dragData));

                    // 투명 1x1 이미지 설정 (이중 박스 및 기본 OS 금지 아이콘 대체)
                    const emptyImg = new Image();
                    emptyImg.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                    e.dataTransfer.setDragImage(emptyImg, 0, 0);
                });

                // 드래그 종료 시 상태 초기화 및 고스트 가이드 제거
                div.addEventListener('dragend', () => {
                    isDragging = false;
                    isLongPress = false;
                    clearTimeout(pressTimer);
                    window.currentDraggingTemplate = null;
                    removeDragGhost();
                    removeGlobalDragGhost();
                });

                // 마우스 이벤트
                div.addEventListener('mousedown', startPress);
                div.addEventListener('mouseup', endPress);
                div.addEventListener('mouseleave', endPress);

                // 터치 이벤트
                div.addEventListener('touchstart', startPress);
                div.addEventListener('touchend', endPress);
                div.addEventListener('touchcancel', endPress);

                // 마우스 이동 감지
                div.addEventListener('mousemove', (e) => {
                    if (Math.abs(e.movementX) > 5 || Math.abs(e.movementY) > 5) {
                        isDragging = true;
                        clearTimeout(pressTimer);
                    }
                });

                // 학습항목 텍스트 컨테이너
                const textContent = document.createElement('span');
                
                // 범위량 합계 계산
                let totalRange = 0;
                if (item.scopes && item.scopes.length > 0) {
                    totalRange = item.scopes.reduce((sum, scope) => {
                        return sum + (scope.end - scope.begin + 1);
                    }, 0);
                }
                
                textContent.textContent = `${item.itemName} (${item.subjectName}) - ${totalRange}`;
                div.appendChild(textContent);

                // 삭제 버튼 추가
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-item-btn';
                deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
                deleteBtn.title = '삭제';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    showDeleteConfirmationModal(item.id);
                };
                div.appendChild(deleteBtn);

                itemList.appendChild(div);
            });
        }

        // 새로운 범위 입력 필드 추가 함수 수정
        function addNewScope(begin = null, end = null) {
            const scopesList = document.getElementById('scopesList');
            const rows = scopesList.getElementsByClassName('scope-row');
            
            // 이전 범위의 end 값을 확인
            let minBegin = 1;
            if (rows.length > 0) {
                const lastRow = rows[rows.length - 1];
                const lastEnd = parseInt(lastRow.querySelector('.scope-end').value);
                minBegin = lastEnd + 1;
            }

            // begin과 end 값 설정
            if (begin === null) {  // 범위 추가 버튼으로 호출된 경우
                begin = minBegin;
                end = begin + 1;
            }
            
            const row = document.createElement('tr');
            row.className = 'scope-row';
            
            row.innerHTML = `
                <td>
                    <input type="number" class="scope-begin" value="${begin}" min="${minBegin}" max="999" required
                           oninput="validateScopeRange(this)" onchange="validateScopeRange(this)">
                </td>
                <td>
                    <input type="number" class="scope-end" value="${end}" min="${begin}" max="999" required
                           oninput="validateScopeRange(this)" onchange="validateScopeRange(this)">
                </td>
                <td class="scope-actions">
                    <button type="button" class="delete-scope" onclick="deleteScope(this)" title="삭제">
                        <i class="fas fa-times"></i>
                    </button>
                </td>
            `;
            
            scopesList.appendChild(row);
            
            // 입력 필드에 이벤트 리스너 추가
            const beginInput = row.querySelector('.scope-begin');
            const endInput = row.querySelector('.scope-end');
            
            beginInput.addEventListener('input', () => updateEndMin(beginInput, endInput));
            
            // 다음 범위의 begin 최소값 업데이트
            if (rows.length > 0) {
                updateNextRowMinBegin(row);
            }
        }

        // 범위 삭제 함수 수정
        function deleteScope(button) {
            const row = button.closest('.scope-row');
            const nextRow = row.nextElementSibling;
            row.remove();
            
            // 삭제 후 남은 범위들의 최소값 재조정
            const scopesList = document.getElementById('scopesList');
            const rows = scopesList.getElementsByClassName('scope-row');
            for (let i = 0; i < rows.length; i++) {
                if (i === 0) {
                    updateRowMinValues(rows[i], 1);
                } else {
                    const prevRow = rows[i - 1];
                    const prevEnd = parseInt(prevRow.querySelector('.scope-end').value);
                    updateRowMinValues(rows[i], prevEnd + 1);
                }
            }
        }

        // 범위 유효성 검사 함수 수정
        function validateScopeRange(input) {
            const row = input.closest('.scope-row');
            const beginInput = row.querySelector('.scope-begin');
            const endInput = row.querySelector('.scope-end');
            const beginValue = parseInt(beginInput.value);
            const endValue = parseInt(endInput.value);
            
            if (input.classList.contains('scope-begin')) {
                // 시작값이 변경된 경우
                const minBegin = parseInt(beginInput.min);
                if (beginValue < minBegin) {
                    beginInput.value = minBegin;
                    showMessage(`시작값은 ${minBegin} 이상이어야 합니다.`);
                }
                endInput.min = parseInt(beginInput.value);
                if (endValue < beginValue) {
                    endInput.value = beginValue;
                    showMessage('끝값은 시작값보다 작을 수 없습니다.');
                }
            } else {
                // 끝값이 변경된 경우
                if (endValue < beginValue) {
                    endInput.value = beginValue;
                    showMessage('끝값은 시작값보다 작을 수 없습니다.');
                }
            }
            
            // 다음 범위의 최소값 업데이트
            updateNextRowMinBegin(row);
        }

        // 다음 범위의 시작 최소값 업데이트 함수 수정
        function updateNextRowMinBegin(currentRow) {
            const nextRow = currentRow.nextElementSibling;
            if (nextRow) {
                const currentEndValue = parseInt(currentRow.querySelector('.scope-end').value);
                const nextBeginInput = nextRow.querySelector('.scope-begin');
                const nextEndInput = nextRow.querySelector('.scope-end');
                
                nextBeginInput.min = currentEndValue + 1;
                if (parseInt(nextBeginInput.value) <= currentEndValue) {
                    nextBeginInput.value = currentEndValue + 1;
                    nextEndInput.value = currentEndValue + 1;
                    showMessage(`새로운 시작값은 이전 끝값(${currentEndValue})보다 커야 합니다.`);
                }
                updateEndMin(nextBeginInput, nextEndInput);
            }
        }

        // 끝값의 최소값 업데이트 함수 수정
        function updateEndMin(beginInput, endInput) {
            const beginValue = parseInt(beginInput.value);
            endInput.min = beginValue;
            if (parseInt(endInput.value) < beginValue) {
                endInput.value = beginValue;
            }
        }

        // 툴팁 표시 함수
        function showTooltip(element, message) {
            // 기존 툴팁 제거
            const existingTooltip = element.parentElement.querySelector('.validation-tooltip');
            if (existingTooltip) {
                existingTooltip.remove();
            }

            // 새 툴팁 생성
            const tooltip = document.createElement('div');
            tooltip.className = 'validation-tooltip';
            tooltip.textContent = message;
            element.parentElement.appendChild(tooltip);

            // 3초 후 툴팁 자동 제거
            setTimeout(() => {
                tooltip.classList.add('fade-out');
                setTimeout(() => tooltip.remove(), 300);
            }, 3000);
        }

        // 스타일 추가
        const style = document.createElement('style');
        style.textContent = `
            .validation-tooltip {
                position: absolute;
                background-color: #dc3545;
                color: white;
                padding: 5px 10px;
                border-radius: 4px;
                font-size: 12px;
                margin-top: 5px;
                z-index: 1000;
                animation: tooltip-fade-in 0.3s ease;
                white-space: nowrap;
            }

            .validation-tooltip::before {
                content: '';
                position: absolute;
                top: -5px;
                left: 10px;
                border-width: 0 5px 5px 5px;
                border-style: solid;
                border-color: transparent transparent #dc3545 transparent;
            }

            .validation-tooltip.fade-out {
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            @keyframes tooltip-fade-in {
                from { opacity: 0; transform: translateY(5px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .scope-row td {
                position: relative;
            }
        `;
        document.head.appendChild(style);

        // 폼 제출 전 최종 유효성 검사 수정
        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const scopesList = document.getElementById('scopesList');
            const rows = scopesList.getElementsByClassName('scope-row');
            
            // 범위가 하나도 없는 경우
            if (rows.length === 0) {
                showMessage('최소 하나의 학습 범위를 추가해주세요.');
                return;
            }
            
            // 범위 데이터 수집 및 유효성 검사
            try {
                const scopes = Array.from(rows).map((row, index) => {
                    const begin = parseInt(row.querySelector('.scope-begin').value);
                    const end = parseInt(row.querySelector('.scope-end').value);
                    
                    // 시작값과 끝값 검사
                    if (end < begin) {
                        throw new Error(`${index + 1}번째 범위의 끝값은 시작값보다 작을 수 없습니다.`);
                    }
                    
                    // 이전 범위와의 관계 검사
                    if (index > 0) {
                        const prevEnd = parseInt(rows[index - 1].querySelector('.scope-end').value);
                        if (begin <= prevEnd) {
                            throw new Error(`${index + 1}번째 범위의 시작값은 이전 범위의 끝값(${prevEnd})보다 커야 합니다.`);
                        }
                    }
                    
                    return { begin, end };
                });
                
                const subjectVal = document.getElementById('subjectSelect').value;
                const parsedSubId = parseInt(subjectVal);
                if (!subjectVal || isNaN(parsedSubId)) {
                    throw new Error('선택된 과목이 없습니다. 과목을 먼저 추가해주세요.');
                }

                const itemData = {
                    itemName: document.getElementById('itemName').value,
                    subId: parsedSubId,
                    scopes: scopes,
                    tag: document.getElementById('itemTag').value
                };
                
                let response;
                const itemId = document.getElementById('itemId').value;
                
                if (itemId) {
                    response = await fetch(`/api/items/${itemId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(itemData)
                    });
                } else {
                    response = await fetch('/api/items', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(itemData)
                    });
                }

                if (response.ok) {
                    await loadItems();  // 학습항목 목록 새로고침
                    
                    // 시간표의 블록들 업데이트
                    if (itemId) {
                        const blocks = document.querySelectorAll(`.schedule-block[data-item-id="${itemId}"]`);
                        const subject = document.getElementById('subjectSelect').options[document.getElementById('subjectSelect').selectedIndex].text;
                        blocks.forEach(block => {
                            block.setAttribute('data-subject', subject);
                            block.setAttribute('data-item-name', itemData.itemName);
                            updateScheduleTime(block);
                        });
                    }
                    
                    closeModal();
                    if (itemId) {
                        showNotificationModal('학습항목이 수정되었습니다.');
                    }
                } else {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || '저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('저장 실패:', error);
                let msg = error.message || '저장에 실패했습니다.';
                if (msg === 'Failed to fetch') {
                    msg = '서버 통신 실패 (Failed to fetch): Django 서버(http://127.0.0.1:8000)가 실행 중인지 확인해주세요.';
                }
                showNotificationModal(msg);
            }
        });

        let itemToDelete = null;

        function showTrashZone() {
            document.getElementById('trashZone').style.display = 'flex';
        }

        function hideTrashZone() {
            document.getElementById('trashZone').style.display = 'none';
            document.getElementById('trashZone').classList.remove('drag-over');
        }

        function handleDragStart(e) {
            // ... existing drag start code ...
            showTrashZone();
        }

        function handleDragEnd(e) {
            // ... existing drag end code ...
            hideTrashZone();
        }

        function showDeleteConfirmationModal(id) {
            itemToDelete = id;
            document.getElementById('deleteConfirmationModal').style.display = 'block';
        }

        function cancelItemDelete() {
            itemToDelete = null;
            document.getElementById('deleteConfirmationModal').style.display = 'none';
        }

        async function confirmItemDelete() {
            if (itemToDelete) {
                try {
                    const response = await fetch(`/api/items/${itemToDelete}`, {
                        method: 'DELETE'
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        // 타임라인에서 해당 항목의 모든 블록 삭제
                        const blocks = document.querySelectorAll(`.schedule-block[data-item-id="${itemToDelete}"]`);
                        blocks.forEach(block => block.remove());
                        
                        // 항목 목록 새로고침
                        await loadItems();
                        showNotificationModal('학습항목이 삭제되었습니다.');
                    } else {
                        throw new Error(result.error || '삭제 실패');
                    }
                } catch (error) {
                    console.error('삭제 실패:', error);
                    showNotificationModal('삭제에 실패했습니다. ' + (error.message || ''));
                }
            }
            cancelItemDelete(); // 모달 닫기
        }

        // Modify the existing drag and drop handling
        document.addEventListener('dragover', function(e) {
            const trashZone = document.getElementById('trashZone');
            const rect = trashZone.getBoundingClientRect();
            
            if (e.clientX >= rect.left && e.clientX <= rect.right &&
                e.clientY >= rect.top && e.clientY <= rect.bottom) {
                e.preventDefault();
                trashZone.classList.add('drag-over');
            } else {
                trashZone.classList.remove('drag-over');
            }
        });

        document.addEventListener('drop', function(e) {
            const trashZone = document.getElementById('trashZone');
            const rect = trashZone.getBoundingClientRect();
            
            if (e.clientX >= rect.left && e.clientX <= rect.right &&
                e.clientY >= rect.top && e.clientY <= rect.bottom) {
                e.preventDefault();
                const itemId = e.dataTransfer.getData('text/plain');
                if (itemId) {
                    showDeleteConfirmationModal(itemId);
                }
            }
            hideTrashZone();
        });

        // 알림 모달 표시
        function showNotificationModal(message) {
            const modal = document.getElementById('notificationModal');
            const messageElement = document.getElementById('notificationMessage');
            messageElement.textContent = message;
            modal.style.display = 'block';

            // 스페이스 키 이벤트 핸들러 추가
            function handleSpaceKey(e) {
                if (e.code === 'Space' && modal.style.display === 'block') {
                    e.preventDefault(); // 스페이스 키의 기본 동작(스크롤) 방지
                    closeNotificationModal();
                    document.removeEventListener('keydown', handleSpaceKey);
                }
            }

            // 이벤트 리스너 등록
            document.addEventListener('keydown', handleSpaceKey);
        }

        // 알림 모달 닫기
        function closeNotificationModal() {
            const modal = document.getElementById('notificationModal');
            modal.style.display = 'none';
            
            // 모달이 닫힐 때 포커스를 적절한 요소로 이동
            const activeElement = document.activeElement;
            if (activeElement && activeElement.blur) {
                activeElement.blur();
            }
        }

        // 새 계획 확인 모달 표시
        function showNewPlanConfirmModal() {
            document.getElementById('newPlanConfirmModal').style.display = 'block';
        }

        // 새 계획 확인 모달 닫기
        function closeNewPlanConfirmModal() {
            document.getElementById('newPlanConfirmModal').style.display = 'none';
        }

        // 새 계획 확인
        function confirmNewPlan() {
            // 타임라인의 모든 일정 블록 제거
            const blocks = document.querySelectorAll('.schedule-block');
            blocks.forEach(block => block.remove());
            closeNewPlanConfirmModal();
        }

        // 시간표 저장
        async function saveTimeTable() {
            try {
                // 타임라인의 모든 일정 블록 수집
                const blocks = document.querySelectorAll('.schedule-block');
                const plans = Array.from(blocks).map(block => {
                    const left = parseInt(block.style.left);
                    const day = Math.floor((left - timelineX - 10) / columnWidth);
                    const top = parseInt(block.style.top) - topMargin;
                    const height = parseInt(block.style.height);
                    const itemId = parseInt(block.getAttribute('data-item-id'));
                    
                    // 시작 시간과 끝 시간을 분 단위로 계산
                    const sTime = Math.round(top / minuteHeight);
                    const eTime = Math.round((top + height) / minuteHeight);

                    return {
                        day: day,
                        itemId: itemId,
                        sTime: sTime,
                        eTime: eTime,
                        tag: ''
                    };
                });

                const response = await fetch('/api/timetable', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(plans)
                });

                if (response.ok) {
                    showNotificationModal('시간표가 저장되었습니다.');
                } else {
                    throw new Error('저장 실패');
                }
            } catch (error) {
                console.error('저장 실패:', error);
                showNotificationModal('저장에 실패했습니다.');
            }
        }

        // 새로운 시간표 만들기
        function createNewPlan() {
            showNewPlanConfirmModal();
        }

        // 시간표 데이터 로드 및 표시
        async function loadTimeTable() {
            try {
                const response = await fetch('/api/timetable');
                const plans = await response.json();
                displayTimeTable(plans);
            } catch (error) {
                console.error('시간표 로드 실패:', error);
            }
        }

        // 시간표를 타임라인에 표시
        function displayTimeTable(plans) {
            // 기존 블록들 제거
            const existingBlocks = document.querySelectorAll('.schedule-block');
            existingBlocks.forEach(block => block.remove());

            plans.forEach(plan => {
                // 해당하는 학습항목 찾기
                const item = items.find(i => i.id === plan.itemId);
                if (!item) return;

                // 블록 위치 계산
                const left = timelineX + (plan.day * columnWidth) + 10;
                const top = topMargin + (plan.sTime * minuteHeight);
                const height = (plan.eTime - plan.sTime) * minuteHeight;

                // 블록 생성
                const block = createScheduleBlock(left, top);
                block.style.height = `${height}px`;
                block.setAttribute('data-item-id', item.id);
                block.setAttribute('data-subject', item.subjectName);
                block.setAttribute('data-item-name', item.itemName);
                
                scheduleContainer.appendChild(block);
                makeResizable(block);
                makeDraggable(block);
                updateScheduleTime(block);
            });
        }

        // 모달 열기 함수
        function openModal(item = null) {
            console.log('Opening modal with item:', item); // 디버깅 로그 추가
            const modal = document.getElementById('itemModal');
            const form = document.getElementById('itemForm');
            const modalTitle = document.getElementById('modalTitle');
            const itemId = document.getElementById('itemId');
            const itemName = document.getElementById('itemName');
            const subjectSelect = document.getElementById('subjectSelect');
            const itemTag = document.getElementById('itemTag');
            const scopesList = document.getElementById('scopesList');

            // 범위 목록 초기화
            scopesList.innerHTML = '';

            if (item) {
                console.log('Item scopes:', item.scopes); // 디버깅 로그 추가
                modalTitle.textContent = '학습항목 수정';
                itemId.value = item.id;
                itemName.value = item.itemName;
                subjectSelect.value = item.subId;
                itemTag.value = item.tag || '';
                
                // 기존 범위 추가
                if (item.scopes && item.scopes.length > 0) {
                    item.scopes.forEach(scope => {
                        console.log('Adding scope:', scope); // 디버깅 로그 추가
                        addNewScope(scope.begin, scope.end);
                    });
                } else {
                    console.log('No scopes found, adding default scope'); // 디버깅 로그 추가
                    addNewScope(); // 기본 범위 하나 추가
                }
            } else {
                modalTitle.textContent = '학습항목 추가';
                form.reset();
                itemId.value = '';
                addNewScope(); // 기본 범위 하나 추가
            }

            modal.style.display = 'block';
            
            // 항목명 필드 자동 선택
            setTimeout(() => {
                itemName.focus();
                itemName.select();
            }, 50);
        }

        // 모달 닫기 함수
        function closeModal() {
            const modal = document.getElementById('itemModal');
            modal.style.display = 'none';
        }

        // 메시지 표시 함수
        function showMessage(message) {
            const messageElement = document.querySelector('.validation-message');
            messageElement.textContent = message;
            messageElement.classList.add('show');
            
            // 3초 후 메시지 숨기기
            setTimeout(() => {
                messageElement.classList.remove('show');
            }, 3000);
        }

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const planId = urlParams.get('plan_id');

        // Load time table lists when the page loads
        async function loadTimeTableLists() {
            if (!planId) {
                window.location.href = '/select_learning_plan';
                return;
            }

            try {
                const response = await fetch(`/api/time_table_lists/${planId}`);
                const timeTableLists = await response.json();
                
                const select = document.getElementById('timeTableListSelect');
                select.innerHTML = '<option value="">시간표 선택</option>';
                
                timeTableLists.forEach(ttl => {
                    const option = document.createElement('option');
                    option.value = ttl.id;
                    option.textContent = ttl.timeTableName;
                    select.appendChild(option);
                });

                // If there's only one time table list, select it automatically
                if (timeTableLists.length === 1) {
                    select.value = timeTableLists[0].id;
                    loadTimeTable(timeTableLists[0].id);
                }
            } catch (error) {
                console.error('시간표 목록 로드 실패:', error);
            }
        }

        // Load time table when a time table list is selected
        async function loadTimeTable(timeTableListId) {
            if (!timeTableListId) return;
            try {
                const response = await fetch(`/api/time_tables/${timeTableListId}`);
                if (!response.ok) return;
                const timeTables = await response.json();
                if (Array.isArray(timeTables)) {
                    displayTimeTable(timeTables);
                }
            } catch (error) {
                console.error('시간표 로드 실패:', error);
            }
        }

        // Add event listener for time table list selection
        document.getElementById('timeTableListSelect').addEventListener('change', function(e) {
            if (e.target.value) {
                loadTimeTable(e.target.value);
            }
        });

        // Modify saveTimeTable function to include timeTableListId
        async function saveTimeTable() {
            const timeTableListId = document.getElementById('timeTableListSelect').value;
            if (!timeTableListId) {
                alert('시간표를 선택해주세요.');
                return;
            }

            try {
                const blocks = document.querySelectorAll('.schedule-block');
                const plans = Array.from(blocks).map(block => {
                    const left = parseInt(block.style.left);
                    const day = Math.floor((left - timelineX - 10) / columnWidth);
                    const top = parseInt(block.style.top) - topMargin;
                    const height = parseInt(block.style.height);
                    const itemId = parseInt(block.getAttribute('data-item-id'));
                    
                    const sTime = Math.round(top / minuteHeight);
                    const eTime = Math.round((top + height) / minuteHeight);

                    return {
                        day: day,
                        itemId: itemId,
                        sTime: sTime,
                        eTime: eTime,
                        tag: '',
                        timeTableListId: timeTableListId
                    };
                });

                const response = await fetch('/api/timetable', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(plans)
                });

                if (response.ok) {
                    showNotificationModal('시간표가 저장되었습니다.');
                } else {
                    throw new Error('저장 실패');
                }
            } catch (error) {
                console.error('저장 실패:', error);
                showNotificationModal('저장에 실패했습니다.');
            }
        }

        // Load time table lists when the page loads
        document.addEventListener('DOMContentLoaded', loadTimeTableLists);
    </script>
</body>
